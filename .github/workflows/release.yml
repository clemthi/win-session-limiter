name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two merges landing close together must not compute the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, to find the previous release and the
          # commits since then.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute next version
        id: version
        shell: bash
        run: echo "tag=$(bash .github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.version.outputs.tag != ''
        run: go test ./...

      - name: Build
        if: steps.version.outputs.tag != ''
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          go build -ldflags "-X winsessionlimiter/internal/version.Version=${tag#v}" \
            -o limiterd.exe ./cmd/limiterd

      - name: Create release
        if: steps.version.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" limiterd.exe \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes

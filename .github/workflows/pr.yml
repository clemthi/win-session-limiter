name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # The code uses golang.org/x/sys/windows, so it only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o limiterd.exe ./cmd/limiterd

      - name: Test
        run: go test ./...

  govulncheck:
    runs-on: windows-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
